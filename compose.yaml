services:
  postgres:
    image: postgres:18.2-bookworm
    container_name: base-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: base
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d base"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
